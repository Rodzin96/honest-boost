<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64" role="img" aria-label="Honest BOOST animated icon">
  <defs>
    <linearGradient id="hb-anim-blade-gradient" x1="14" y1="8" x2="50" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5F9FF"/>
      <stop offset="0.45" stop-color="#C4D3E4"/>
      <stop offset="1" stop-color="#7C8CA0"/>
    </linearGradient>
    <linearGradient id="hb-anim-bolt-gradient" x1="44" y1="10" x2="20" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BFF3FF"/>
      <stop offset="0.5" stop-color="#2FC1FF"/>
      <stop offset="1" stop-color="#0B63F6"/>
    </linearGradient>
    <filter id="hb-anim-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.78  0 0 0 0 1  0 0 0 0.9 0"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="18" fill="#05080F"/>

  <!-- 1. estado inicial: ponto de energia -->
  <circle cx="44" cy="10" r="1.6" fill="#BFF3FF">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.8s" repeatCount="indefinite" keyTimes="0;0.06;0.14;1"/>
  </circle>

  <!-- 2/3. ativação + formação: o raio percorre o traçado antes das lâminas aparecerem -->
  <polyline points="44,10 26,30 34,30 20,54 28,34 36,34 44,10" fill="none" stroke="#BFF3FF" stroke-width="2.4"
    stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="120" stroke-dashoffset="120" filter="url(#hb-anim-glow)">
    <animate attributeName="stroke-dashoffset" values="120;120;0;0;0" dur="1.8s" repeatCount="indefinite" keyTimes="0;0.08;0.42;0.6;1"/>
    <animate attributeName="opacity" values="1;1;1;0;0" dur="1.8s" repeatCount="indefinite" keyTimes="0;0.08;0.42;0.6;1"/>
  </polyline>

  <g>
    <polygon points="17,8 29,8 14,56" fill="url(#hb-anim-blade-gradient)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" dur="1.8s" repeatCount="indefinite" keyTimes="0;0.42;0.58;1"/>
    </polygon>
    <polygon points="50,8 35,55 47,55" fill="url(#hb-anim-blade-gradient)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" dur="1.8s" repeatCount="indefinite" keyTimes="0;0.42;0.58;1"/>
    </polygon>

    <polygon points="44,10 26,30 34,30 20,54 28,34 36,34" fill="none" stroke="#05080F" stroke-width="5" stroke-linejoin="round" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" dur="1.8s" repeatCount="indefinite" keyTimes="0;0.42;0.58;1"/>
    </polygon>

    <!-- 4. impacto: pulso de glow -->
    <polygon points="44,10 26,30 34,30 20,54 28,34 36,34" fill="url(#hb-anim-bolt-gradient)" filter="url(#hb-anim-glow)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1" dur="1.8s" repeatCount="indefinite" keyTimes="0;0.42;0.58;0.62;1"/>
    </polygon>
  </g>

  <!-- 5. estado final: contorno estável do símbolo -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="none" stroke="rgba(191,243,255,0.14)">
    <animate attributeName="opacity" values="0;0;0;1" dur="1.8s" repeatCount="indefinite" keyTimes="0;0.6;0.66;1"/>
  </rect>
</svg>
