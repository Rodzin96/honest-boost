<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Honest Boost</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    
    <style>
        :root {
            --bg-primary: #030512;
            --bg-secondary: #071426;
            --bg-card: rgba(14, 165, 255, 0.08);
            --border-color: rgba(14, 165, 255, 0.15);
            --text-primary: #eef6ff;
            --text-secondary: #94a3b8;
            --text-muted: #5a6888;
            --accent-primary: #0ea5ff;
            --accent-secondary: #00e5d4;
            --success: #57f2b3;
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
            background: linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem 5%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 3rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo span {
            width: 36px;
            height: 36px;
            background: var(--accent-primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }

        .checkout-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(14, 165, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 3rem;
        }

        .checkout-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .checkout-header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .checkout-header p {
            color: var(--text-secondary);
        }

        .plan-summary {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .plan-info h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .plan-info p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .plan-price {
            font-size: 2rem;
            font-weight: 900;
            color: var(--accent-primary);
        }

        .payment-methods {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .payment-method {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 200ms;
        }

        .payment-method:hover,
        .payment-method.selected {
            border-color: var(--accent-primary);
            background: rgba(14, 165, 255, 0.1);
        }

        .payment-method .icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .payment-method .name {
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 200ms;
        }

        .form-group input:focus {
            border-color: var(--accent-primary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
            width: 100%;
            transition: all 200ms;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover {
            background: #0090e0;
        }

        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .guarantee {
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(87, 242, 179, 0.1);
            border: 1px solid rgba(87, 242, 179, 0.3);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .guarantee .icon {
            font-size: 2rem;
        }

        .guarantee h4 {
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .guarantee p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="logo">
            <span>◆</span> Honest BOOST
        </a>
        <a href="/" style="color: var(--text-muted); text-decoration: none;">← Voltar</a>
    </div>

    <div class="checkout-container">
        <div class="checkout-header">
            <h1>Finalizar Compra</h1>
            <p>Complete seu pagamento para começar a otimizar</p>
        </div>

        <div class="plan-summary">
            <div class="plan-info">
                <h3 id="plan-name">Plano Starter</h3>
                <p> Pagamento único • Acesso vitalício</p>
            </div>
            <div class="plan-price" id="plan-price">R$ 67</div>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="seu@email.com" id="email">
        </div>

        <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" placeholder="Seu nome" id="name">
        </div>

        <div class="payment-methods">
            <div class="payment-method selected" onclick="selectPayment(this)">
                <div class="icon">💳</div>
                <div class="name">Cartão</div>
            </div>
            <div class="payment-method" onclick="selectPayment(this)">
                <div class="icon">📱</div>
                <div class="name">PIX</div>
            </div>
            <div class="payment-method" onclick="selectPayment(this)">
                <div class="icon">🏦</div>
                <div class="name">Boleto</div>
            </div>
        </div>

        <button class="btn btn-primary" onclick="processPayment()">
            Pagar Agora
        </button>

        <div class="secure-badge">
            🔒 Pagamento 100% seguro • Criptografia SSL
        </div>

        <div class="guarantee">
            <div class="icon">🛡️</div>
            <div>
                <h4>Garantia de 7 dias</h4>
                <p>Se não ficar satisfeito, devolvemos 100% do seu dinheiro.</p>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const plan = params.get('plan') || 'starter';
        
        const plans = {
            basic: { name: 'Plano Básico', price: 'R$ 47' },
            starter: { name: 'Plano Starter', price: 'R$ 67' },
            pro: { name: 'Plano Pro', price: 'R$ 97' }
        };
        
        document.getElementById('plan-name').textContent = plans[plan].name;
        document.getElementById('plan-price').textContent = plans[plan].price;

        function selectPayment(el) {
            document.querySelectorAll('.payment-method').forEach(m => m.classList.remove('selected'));
            el.classList.add('selected');
        }

        function processPayment() {
            const email = document.getElementById('email').value;
            const name = document.getElementById('name').value;
            
            if (!email || !name) {
                alert('Preencha todos os campos');
                return;
            }
            
            // Redirect to payment or process here
            alert('Redirecionando para pagamento...');
        }
    </script>
</body>
</html>
