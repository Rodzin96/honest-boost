<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar — Honest Boost</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0a0f1a">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('hb-theme');
                if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
        })();
    </script>
</head>
<body>

    <header class="app-header" id="app-header" style="position:fixed;top:0;left:0;right:0;">
        <div class="container header-inner">
            <a href="index.html" class="brand">
                <span class="brand-icon"><span class="material-symbols-rounded">rocket_launch</span></span>
                Honest<span>Boost</span>
            </a>
            <div class="header-actions">
                <button class="icon-btn" id="theme-toggle" data-state="dark" aria-label="Alternar tema" title="Alternar modo claro/escuro">
                    <span class="material-symbols-rounded theme-icon sun" style="display:none;">light_mode</span>
                    <span class="material-symbols-rounded theme-icon moon">dark_mode</span>
                </button>
            </div>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-wrapper">
            <div class="auth-logo">
                <h1><span class="material-symbols-rounded" style="color:var(--primary);font-size:2.4rem;">rocket_launch</span> Honest Boost</h1>
                <p>Crie sua conta e otimize seu Windows</p>
            </div>

            <div class="auth-card">
                <form id="regForm">
                    <div class="form-group">
                        <label for="username">Usuário ou Email</label>
                        <input id="username" name="username" type="email" placeholder="seu@email.com" class="input-field" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input id="password" name="password" type="password" placeholder="Mínimo 8 caracteres" class="input-field" required minlength="8">
                        <div class="password-strength"><div class="password-strength-bar"></div></div>
                        <div class="strength-text">Força: <span id="strengthText">-</span></div>
                    </div>

                    <div class="form-group" style="display:flex;align-items:center;gap:8px;">
                        <input type="checkbox" id="terms" required style="width:18px;height:18px;accent-color:var(--primary);">
                        <label for="terms" style="margin:0;font-size:0.9rem;">Concordo com os <a href="/terms.html">termos de uso</a></label>
                    </div>

                    <button class="btn btn-filled btn-block" type="submit" id="regBtn">
                        <span class="material-symbols-rounded">person_add</span> Criar Conta
                    </button>
                </form>

                <div class="divider"><span>OU</span></div>

                <div class="social-login">
                    <a href="/auth/google" class="social-btn">
                        <span class="material-symbols-rounded">g_mobiledata</span> Google
                    </a>
                </div>

                <div class="footer-links center">
                    <span style="color:var(--on-surface-variant);">Já tem uma conta?</span>
                    <a href="/login.html"><span class="material-symbols-rounded" style="font-size:16px;vertical-align:-3px;">login</span> Faça login</a>
                </div>

                <div id="msg"></div>
            </div>
        </div>
    </main>

    <script>
        // Theme toggle
        (function () {
            var btn = document.getElementById('theme-toggle');
            var t = document.documentElement.getAttribute('data-theme');
            btn.setAttribute('data-state', t);
            btn.querySelector('.sun').style.display = t === 'light' ? 'inline-block' : 'none';
            btn.querySelector('.moon').style.display = t === 'dark' ? 'inline-block' : 'none';
            btn.addEventListener('click', function () {
                var current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
                var next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                btn.setAttribute('data-state', next);
                localStorage.setItem('hb-theme', next);
                btn.querySelector('.sun').style.display = next === 'light' ? 'inline-block' : 'none';
                btn.querySelector('.moon').style.display = next === 'dark' ? 'inline-block' : 'none';
            });
        })();

        // Password strength
        var passwordInput = document.getElementById('password');
        var strengthBar = document.querySelector('.password-strength-bar');
        var strengthText = document.getElementById('strengthText');
        function checkPasswordStrength(password) {
            var strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 12) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            if (strength < 2) { strengthBar.className = 'password-strength-bar weak'; strengthText.textContent = 'Fraca'; }
            else if (strength < 4) { strengthBar.className = 'password-strength-bar medium'; strengthText.textContent = 'Média'; }
            else { strengthBar.className = 'password-strength-bar strong'; strengthText.textContent = 'Forte'; }
        }
        passwordInput.addEventListener('input', function (e) { checkPasswordStrength(e.target.value); });

        // Register form
        document.getElementById('regForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            var btn = document.getElementById('regBtn');
            var msgDiv = document.getElementById('msg');
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-rounded" style="font-size:20px;">progress_activity</span> Criando conta...';
            msgDiv.textContent = '';
            msgDiv.className = '';

            try {
                var f = new FormData(e.target);
                var res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: f.get('username'), password: f.get('password') })
                });
                var data = await res.json();
                if (res.ok) {
                    msgDiv.textContent = 'Conta criada com sucesso! Redirecionando...';
                    msgDiv.className = 'success';
                    setTimeout(function () { window.location = '/login.html'; }, 1500);
                } else {
                    msgDiv.textContent = data.error || 'Erro ao criar conta';
                    msgDiv.className = 'error';
                    btn.disabled = false;
                    btn.innerHTML = '<span class="material-symbols-rounded">person_add</span> Criar Conta';
                }
            } catch (err) {
                msgDiv.textContent = 'Erro de conexão. Tente novamente.';
                msgDiv.className = 'error';
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-rounded">person_add</span> Criar Conta';
            }
        });
    </script>
</body>
</html>
