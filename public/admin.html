<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Licenças | Honest Boost</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0a0f1a">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('hb-theme');
                if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
        })();
    </script>
</head>
<body>

    <header class="app-header" id="app-header">
        <div class="container header-inner">
            <a href="index.html" class="brand">
                <span class="brand-icon"><span class="material-symbols-rounded">rocket_launch</span></span>
                Honest<span>Boost</span>
            </a>
            <div class="header-actions">
                <button class="icon-btn" id="theme-toggle" data-state="dark" aria-label="Alternar tema" title="Alternar modo claro/escuro">
                    <span class="material-symbols-rounded theme-icon sun" style="display:none;">light_mode</span>
                    <span class="material-symbols-rounded theme-icon moon">dark_mode</span>
                </button>
                <a href="index.html" class="btn btn-text"><span class="material-symbols-rounded">arrow_back</span> Voltar</a>
            </div>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <h1 style="margin-bottom:1.5rem;display:flex;align-items:center;gap:12px;">
                <span class="material-symbols-rounded" style="color:var(--primary);font-size:2rem;">admin_panel_settings</span> Admin — Licenças
            </h1>

            <div id="list" class="table-wrap">
                <div style="padding:2rem;text-align:center;color:var(--on-surface-variant);">
                    <span class="material-symbols-rounded" style="font-size:2rem;">hourglass</span><br>Carregando...
                </div>
            </div>

            <div style="margin-top:1.5rem;display:flex;gap:0.8rem;flex-wrap:wrap;">
                <a href="/api/licenses" class="btn btn-outlined" target="_blank">
                    <span class="material-symbols-rounded">data_object</span> Ver JSON
                </a>
                <button id="refreshBtn" class="btn btn-tonal">
                    <span class="material-symbols-rounded">refresh</span> Atualizar
                </button>
            </div>
        </div>
    </main>

    <script>
        (function () {
            var btn = document.getElementById('theme-toggle');
            var t = document.documentElement.getAttribute('data-theme');
            btn.setAttribute('data-state', t);
            btn.querySelector('.sun').style.display = t === 'light' ? 'inline-block' : 'none';
            btn.querySelector('.moon').style.display = t === 'dark' ? 'inline-block' : 'none';
            btn.addEventListener('click', function () {
                var current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
                var next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                btn.setAttribute('data-state', next);
                localStorage.setItem('hb-theme', next);
                btn.querySelector('.sun').style.display = next === 'light' ? 'inline-block' : 'none';
                btn.querySelector('.moon').style.display = next === 'dark' ? 'inline-block' : 'none';
            });
        })();

        function load() {
            var list = document.getElementById('list');
            list.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--on-surface-variant);"><span class="material-symbols-rounded" style="font-size:2rem;">hourglass</span><br>Carregando...</div>';
            fetch('/api/licenses')
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (!Array.isArray(data)) {
                        list.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--error);"><span class="material-symbols-rounded" style="font-size:2rem;">error</span><br>Erro ao carregar licenças. Faça login como admin.</div>';
                        return;
                    }
                    if (!data.length) {
                        list.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--on-surface-variant);"><span class="material-symbols-rounded" style="font-size:2rem;">inbox</span><br>Nenhuma licença gerada ainda.</div>';
                        return;
                    }
                    var html = '<table><thead><tr><th>ID</th><th>Chave</th><th>Email</th><th>Produto</th><th>Status</th><th>Criado em</th></tr></thead><tbody>';
                    data.forEach(function (r) {
                        var status = r.status === 'active' ? '<span class="status-badge status-active"><span class="material-symbols-rounded" style="font-size:14px;">check_circle</span> ' + r.status + '</span>' : '<span class="status-badge status-pending"><span class="material-symbols-rounded" style="font-size:14px;">schedule</span> ' + r.status + '</span>';
                        html += '<tr>'
                            + '<td>' + r.id + '</td>'
                            + '<td style="font-family:\'Courier New\',monospace;font-size:0.82rem;">' + r.license_key + '</td>'
                            + '<td>' + (r.email || '-') + '</td>'
                            + '<td>' + r.product + '</td>'
                            + '<td>' + status + '</td>'
                            + '<td style="font-size:0.82rem;color:var(--on-surface-variant);">' + r.created_at + '</td>'
                            + '</tr>';
                    });
                    html += '</tbody></table>';
                    list.innerHTML = html;
                })
                .catch(function (err) {
                    console.error(err);
                    list.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--error);"><span class="material-symbols-rounded" style="font-size:2rem;">error</span><br>Erro de conexão.</div>';
                });
        }
        load();

        document.getElementById('refreshBtn').addEventListener('click', load);
    </script>
</body>
</html>
