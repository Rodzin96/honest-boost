<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha — Honest Boost</title>
    <meta name="description" content="Defina uma nova senha para sua conta Honest Boost.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0a0f1a">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('hb-theme');
                if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
        })();
    </script>
    <style>
        .auth-card h1 { font-size:1.65rem; margin-bottom:.45rem; }
        .intro { color:var(--on-surface-variant); margin-bottom:1.4rem; }
        .msg { margin-top:1rem; min-height:24px; }
        .msg.error,.msg.success,.msg.info { padding:.85rem 1rem; border-radius:12px; }
    </style>
</head>
<body>
    <header class="app-header" id="app-header">
        <div class="container header-inner">
            <a href="/" class="brand"><span class="brand-icon"><span class="material-symbols-rounded">bolt</span></span><span>Honest BOOST</span></a>
            <div class="header-actions"><button class="icon-btn" id="theme-toggle" data-state="dark" aria-label="Alternar tema"><span class="material-symbols-rounded theme-icon sun" style="display:none;">light_mode</span><span class="material-symbols-rounded theme-icon moon">dark_mode</span></button></div>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-wrapper">
            <div class="auth-card card">
                <h1>Definir nova senha</h1>
                <p class="intro">Cole o token recebido e escolha uma senha forte para concluir a recuperação.</p>
                <form id="resetForm" novalidate>
                    <div class="form-group">
                        <label for="token">Token</label>
                        <input id="token" name="token" type="text" class="input-field" placeholder="Cole o token recebido" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Nova senha</label>
                        <input id="password" name="password" type="password" class="input-field" placeholder="Mínimo de 8 caracteres" autocomplete="new-password" required>
                        <div class="password-strength" aria-hidden="true"><div class="password-strength-bar"></div></div>
                        <div class="strength-text">Força: <span id="strengthText">-</span></div>
                    </div>
                    <button class="btn btn-filled btn-block" type="submit" id="resetBtn">
                        <span class="material-symbols-rounded">check</span>
                        Alterar senha
                    </button>
                </form>
                <div class="footer-links center">
                    <a href="/login.html">Voltar para login</a>
                </div>
                <div id="msg" class="msg" aria-live="polite"></div>
            </div>
        </div>
    </main>

    <script src="/js/hb.js" defer></script>
    <script src="/js/reset.js" defer></script>
</body>
</html>
