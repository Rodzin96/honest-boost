# Release do instalador Windows (NSIS) + publicação no GitHub Releases.
# Uso: git tag v2.0.1 && git push origin v2.0.1
# O workflow compila o NSIS, cria a Release via GitHub CLI e anexa .exe/.blockmap + latest.yml
name: Release desktop (Windows)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Release guard (tag x versão do pacote)
        run: |
          $tag = "${{ github.ref_name }}"
          $tagVersion = $tag.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "Tag: $tagVersion | package.json: $pkg"
          if ($tagVersion -ne $pkg) {
            Write-Error "A tag ($tagVersion) não corresponde à version do desktop/package.json ($pkg). O latest.yml sairia com a versão errada e nenhum cliente veria a atualização. Suba a version antes de taggear."
            exit 1
          }

      - name: Install deps
        run: npm ci

      - name: Build NSIS (sem publish)
        run: npm run build:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: vars
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "version=$version" >> $env:GITHUB_OUTPUT

      # O electron-builder já publica (há "publish" no desktop/package.json).
      # Este passo confere que os 3 assets realmente existem; se o build falhar,
      # o job para — uma Release pública sem instalador quebraria o auto-update.
      - name: Verify release assets
        run: |
          $v = "${{ steps.vars.outputs.version }}"
          $expected = @(
            "dist/Honest-Boost-Setup-$v.exe",
            "dist/Honest-Boost-Setup-$v.exe.blockmap",
            "dist/latest.yml"
          )
          $missing = @()
          foreach ($f in $expected) { if (-not (Test-Path $f)) { $missing += $f } }
          if ($missing.Count -gt 0) {
            Write-Error "Assets ausentes: $($missing -join ', ')"
            exit 1
          }
          Write-Host "Assets presentes:"; Get-ChildItem dist | Select-Object Name, Length | Format-Table

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.vars.outputs.version }}
          body: |
            ## Honest Boost ${{ steps.vars.outputs.version }}
            
            Instalador Windows (NSIS) para o otimizador Honest Boost.
            
            ### Auto-update
            O app detecta automaticamente esta versão via `latest.yml`.
          files: |
            desktop/dist/Honest-Boost-Setup-${{ steps.vars.outputs.version }}.exe
            desktop/dist/Honest-Boost-Setup-${{ steps.vars.outputs.version }}.exe.blockmap
            desktop/dist/latest.yml
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}