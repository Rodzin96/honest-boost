# Render Blueprint — deploy automático do site Honest Boost.
# Uso: em render.com, escolha "New +" → "Blueprint" e aponte para este repositório.
# As variáveis com `sync: false` devem ser preenchidas no Dashboard (Service → Environment)
# na primeira vez; os segredos nunca ficam neste arquivo.
services:
  - type: web
    name: honest-boost
    runtime: node
    plan: free
    buildCommand: NODE_ENV=production npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://honest-boost.onrender.com
      # NUNCA fixar PORT aqui: o Render injeta a porta automaticamente e o
      # health check interno mira nela. Com PORT=3000 fixo o deploy morria com
      # "Timed out waiting for internal health check ... :3000/health".
      # O server.js já usa process.env.PORT com fallback 3000 para dev local.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: STRIPE_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      # Login com Google (opcional): criar cliente OAuth e preencher as 3.
      # Redirect autorizado no Google: https://honest-boost.onrender.com/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false