version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: honest_boost
      POSTGRES_USER: honest_boost
      POSTGRES_PASSWORD: honest_boost_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=change-me-to-a-32-character-minimum-secret
      - DATABASE_URL=postgresql://honest_boost:honest_boost_dev@db:5432/honest_boost
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  pgdata:
  node_modules:
